name: Schedule Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"  # Kör var 10:e minut
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # === Steg 1: Generera vanliga schemat ===
      - name: Generate index.html
        run: python generate_all.py

      # === Steg 2: Kör nya debug-versionen (verbose-test) ===
      - name: Run verbose debug
        run: python generate_debug_ma_verbose.py

      # === Steg 3: Commit & push ===
      - name: Commit and push results
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html debug_ma.json || true
          git commit -m "Update schedule and verbose debug info" || echo "No changes to commit"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
