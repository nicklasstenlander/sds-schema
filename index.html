
<!DOCTYPE html>
<html lang='sv'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='refresh' content='600'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Dagens schema</title>
    <style>
        body {
            font-family: 'Agrandir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #000;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            color: #000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        th {
            background-color: #a3c0b2;
            color: #000;
            padding: 1rem;
            text-align: left;
        }
        td {
            padding: 0.75rem;
            border-bottom: 1px solid #ccc;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .columns {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 2rem;
        }
        .column {
            flex: 1 1 45%;
            min-width: 320px;
        }
    </style>
</head>
<body>
    <h1>Dagens schema – 2025-11-04</h1>
    <div class='columns'>
        <div class='column'><p><em>Inga klasser i Light Box idag</em></p></div>
        <div class='column'><p><em>Inga klasser i Black Box idag</em></p></div>
    </div>
    <div class='column'><p><em>Inga klasser i Övriga salar idag</em></p></div>
</body>
</html>
