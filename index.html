
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schema – Sollentuna Dans & Scenskola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Agrandir', sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .day {
      margin-bottom: 3rem;
    }
    .day h2 {
      font-size: 1.8rem;
      color: #000000;
      border-bottom: 2px solid #CDDCD1;
      padding-bottom: 0.5rem;
    }
    .room {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #a3c0b2;
      border-radius: 8px;
      background-color: #f8f8f8;
    }
    .room h3 {
      margin-top: 0;
      color: #333;
    }
    .lesson {
      background-color: #CDDCD1;
      margin: 0.5rem 0;
      padding: 0.8rem 1rem;
      border-radius: 6px;
    }
    .lesson strong {
      display: block;
      font-size: 1.1rem;
    }
    .lesson small {
      display: block;
      margin-top: 0.3rem;
      color: #333;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .day h2 { font-size: 1.4rem; }
      .lesson { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <h1>Schema – Aktuella lektioner</h1>
</body>
</html>
