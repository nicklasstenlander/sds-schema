
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="600">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema sollentunadans</title>
    <style>
        body {
            font-family: 'Agrandir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #000;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h2.date-line {
            text-align: center;
            color: #555;
            font-weight: 400;
            margin-top: 0.5rem;
            margin-bottom: 2.5rem;
            font-size: 1.4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            gap: 4rem;
            flex-wrap: wrap;
        }
        .column {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }
        .column h2 {
            background-color: #000;
            color: #fff;
            padding: 0.8rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        .class-card {
            background-color: #f4f4f4; /* Ljusare grå för bättre kontrast */
            padding: 1.2rem;
            border-left: 6px solid #000; /* Accentfärg */
            margin-bottom: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .class-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .time {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            margin: 0;
        }
        .teacher {
            font-style: italic;
            color: #666;
            margin: 0.2rem 0 0 0;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema</h1>
    <h2 class="date-line">Onsdag 19 november 2025</h2>
    
    <div class="wrapper">
        <div class="column">
            <h2>Light Box</h2>
            <p style='color:#777; font-style:italic;'>Inga klasser i denna sal idag</p>
        </div>
        <div class="column">
            <h2>Black Box</h2>
            <p style='color:#777; font-style:italic;'>Inga klasser i denna sal idag</p>
        </div>
    </div>

    </body>
</html>
