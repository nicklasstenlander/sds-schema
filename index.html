<!DOCTYPE html>
<html lang='sv'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='refresh' content='600'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Dagens schema</title>
    <style>
        body {
            font-family: 'Agrandir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #fff;
            color: #000;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
        }
        .column {
            width: 48%;
            float: left;
            margin: 1%;
        }
        .column h2 {
            text-align: left;
        }
        .course-card {
            background-color: #d3ded6;
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
        }
        .course-card strong {
            display: block;
            font-size: 1.2rem;
        }
        .course-card em {
            display: block;
            margin-top: 0.3rem;
            font-style: italic;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema – Måndag 2025-11-03</h1>
    <div class='column'>
        <h2>Light Box</h2>
        
    </div>
    <div class='column'>
        <h2>Black Box</h2>
        
    </div>
</body>
</html>
