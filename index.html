<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Dagens Schema | Sollentuna Dans & Scenskola</title>
<link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">
<meta http-equiv="refresh" content="600">
<style>
  body {
    font-family: 'Agrandir', sans-serif;
    background-color: #fff;
    color: #000;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  h2 {
    text-align: center;
    font-weight: normal;
    font-size: 1.2rem;
    margin-bottom: 2rem;
  }
  .columns {
    display: flex;
    justify-content: space-between;
    gap: 2rem;
  }
  .column {
    width: 48%;
  }
  h3 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }
  .class {
    background-color: #CDDCD1;
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .class strong {
    display: block;
    font-size: 1.1rem;
    margin-bottom: 0.2rem;
  }
  .class small {
    font-style: italic;
    color: #333;
  }
</style>
</head>
<body>
<h1>Dagens Schema</h1>
<h2>Onsdag 2025-11-05</h2>
<div class="columns">
<div class="column"><h3>Light Box</h3><p>Inga lektioner.</p></div><div class="column"><h3>Black Box</h3><p>Inga lektioner.</p></div>
</div>
</body>
</html>
