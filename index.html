
<!DOCTYPE html>
<html lang='sv'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='refresh' content='600'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Dagens schema</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #fff;
            color: #000;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .columns {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th {
            background-color: #a3c0b2;
            padding: 1rem;
            text-align: left;
            font-size: 1.25rem;
        }
        td {
            padding: 0.75rem;
            border-bottom: 1px solid #ccc;
            font-size: 1.1rem;
        }
        .column {
            width: 45%;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema </h1>
    <div class="columns">
        <div class='column'><table><tr><th colspan='3'>Light Box</th></tr><tr><th>Tid</th><th>Kurs</th><th>Lärare</th></tr></table></div>
        <div class='column'><table><tr><th colspan='3'>Black Box</th></tr><tr><th>Tid</th><th>Kurs</th><th>Lärare</th></tr></table></div>
    </div>
</body>
</html>
