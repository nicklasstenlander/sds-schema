
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="600">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagens schema</title>
    <link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Agrandir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .column {
            width: 45%;
            min-width: 300px;
        }
        h2 {
            text-align: center;
            background-color: #a3c0b2;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.5rem;
        }
        .box {
            background-color: #CDDCD1;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 16px;
        }
        .title {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .time {
            margin-top: 0.5rem;
        }
        .teacher {
            margin-top: 0.5rem;
            font-style: italic;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema – Tuesday 2025-11-04</h1>
    <div class="container">
        <div class="column">
            <h2>Light Box</h2>
            
    <div class="box">
        <div class="title">Barndans 4-5</div>
        <div class="time">Mån 16.30-17.15</div>
        <div class="teacher">Madde</div>
    </div>
    
    <div class="box">
        <div class="title">Showjazz 8-9</div>
        <div class="time">Mån 16.30-17.15</div>
        <div class="teacher">Amanda</div>
    </div>
    
        </div>
        <div class="column">
            <h2>Black Box</h2>
            
    <div class="box">
        <div class="title">Commercial Jazz 13+</div>
        <div class="time">Mån 18.30-19.30</div>
        <div class="teacher">Amanda, Madde</div>
    </div>
    
        </div>
    </div>
</body>
</html>
