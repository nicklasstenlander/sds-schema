
<!DOCTYPE html>
<html lang='sv'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='refresh' content='600'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Dagens schema</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #fff;
            color: #000;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        .columns {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        .column {
            width: 45%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        td {
            padding: 0.75rem;
            border-bottom: 1px solid #ccc;
            text-align: left;
        }
        h2 {
            background-color: #a3c0b2;
            padding: 1rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema</h1>
    <div class='columns'>
        <div class='column'><h2>Light Box</h2><table></table></div>
        <div class='column'><h2>Black Box</h2><table></table></div>
    </div>
</body>
</html>
