
<!DOCTYPE html>
<html lang='sv'>
<head>
    <meta charset='UTF-8'>
    <meta http-equiv='refresh' content='600'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Dagens schema</title>
    <style>
        body {
            font-family: 'Agrandir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #000;
            margin: 0;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-weight: 600;
        }
        h2 {
            text-align: center;
            color: #444;
            font-weight: 400;
            margin-top: 0.2rem;
        }
        .wrapper {
            display: flex;
            justify-content: space-between;
            gap: 2%;
            margin-top: 2rem;
        }
        .column {
            width: 48%;
        }
        .column h2 {
            background-color: #a3c0b2;
            color: #000;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-weight: 600;
        }
        .class-card {
            background-color: #CDDCD1;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }
        .class-card h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        .class-card p {
            margin: 0.2rem 0;
            font-size: 1rem;
        }
        em {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Dagens Schema</h1>
    <h2>Tisdag 4 november 2025</h2>
    <div class='wrapper'>
        <div class='column'>
            <h2>Light Box</h2>
            
        <div class='class-card'>
            <h3>Jazz/Balett 60+</h3>
            <p>12:30–13:45</p>
            <p><em>Madde</em></p>
        </div>
        
        <div class='class-card'>
            <h3>Education Program 1 (EP Y1)</h3>
            <p>17:00–17:00</p>
            <p><em></em></p>
        </div>
        
        <div class='class-card'>
            <h3>Talent Program</h3>
            <p>17:15–18:15</p>
            <p><em>Sofia, Hilda</em></p>
        </div>
        
        <div class='class-card'>
            <h3>Jazz 16+</h3>
            <p>19:45–21:15</p>
            <p><em>Sofia</em></p>
        </div>
        
        </div>
        <div class='column'>
            <h2>Black Box</h2>
            <p style='color:#777;'>Inga klasser idag</p>
        </div>
    </div>
</body>
</html>
