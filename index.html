
<!DOCTYPE html>
<html lang='sv'>
<head>
<meta charset='UTF-8'>
<meta http-equiv='refresh' content='600'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Dagens schema</title>
<style>
    body {
        font-family: 'Agrandir', sans-serif;
        background: #fff;
        color: #000;
        padding: 2rem;
    }
    h1 {
        text-align: center;
        font-weight: 600;
    }
    h2 {
        text-align: center;
        font-weight: 400;
        color: #444;
        margin-top: 0.2rem;
    }
    .wrapper {
        display: flex;
        justify-content: center;
        gap: 3rem;
        margin-top: 2rem;
        flex-wrap: wrap;
    }
    .column {
        width: 300px;
    }
    .column h2 {
        background: #a3c0b2;
        color: #000;
        padding: 0.8rem;
        border-radius: 0.5rem;
        text-align: center;
    }
    .class-card {
        background: #CDDCD1;
        padding: 1rem;
        border-radius: 1rem;
        margin-bottom: 1rem;
    }
</style>
</head>
<body>
    <h1>Dagens Schema</h1>
    <h2>Lördag 8 november 2025</h2>
    <div class='wrapper'>
        <div class='column'>
            <h2>Light Box</h2>
            <p style='color:#777;'>Inga klasser idag</p>
        </div>
        <div class='column'>
            <h2>Black Box</h2>
            <p style='color:#777;'>Inga klasser idag</p>
        </div>
    </div>
</body>
</html>
