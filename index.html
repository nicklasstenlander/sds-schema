
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schema – Aktuella lektioner</title>
  <style>
    body {
      font-family: 'Agrandir', sans-serif;
      background-color: white;
      color: black;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
    }

    h2 {
      margin-top: 2rem;
      font-size: 1.8rem;
    }

    h3 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .columns {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .column {
      flex: 1;
      background-color: #CDDCD1;
      padding: 1rem;
      border-radius: 8px;
    }

    p {
      margin: 0.5rem 0;
    }

    .teacher {
      float: right;
      font-style: italic;
      font-size: 0.9rem;
      color: #444;
    }

    @media (max-width: 768px) {
      .columns {
        flex-direction: column;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      h3 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <h1>Schema – Aktuella lektioner</h1>
  <div id="schema"></div>

  <script>
    async function fetchData() {
      const response = await fetch('data.json');
      const data = await response.json();

      const visibleEvents = events.filter(event => String(event.showing) === "true");

      // Grupp per dag och sal
      const grouped = {};

      for (const event of events) {
        const day = getWeekday(event.schedule?.start?.date || '');
        const sal = event.place || 'Okänd sal';
        const time = event.schedule?.start?.time?.slice(0, 5) || '';
        const title = event.name || '';
        const teacher = event.instructorsName || '';

        if (!grouped[day]) grouped[day] = { 'Light Box': [], 'Black Box': [], 'Annat': [] };
        const slot = sal === 'Light Box' ? 'Light Box' : sal === 'Black Box' ? 'Black Box' : 'Annat';
        grouped[day][slot].push({ time, title, teacher });
      }

      const sortedDays = Object.keys(grouped).sort(daySort);
      const container = document.getElementById('schema');

      for (const day of sortedDays) {
        const daySection = document.createElement('div');
        daySection.innerHTML = `<h2>${day}</h2>`;
        const wrapper = document.createElement('div');
        wrapper.className = 'columns';

        for (const sal of ['Light Box', 'Black Box']) {
          const list = grouped[day][sal];
          list.sort((a, b) => a.time.localeCompare(b.time)); // Sort by time

          const column = document.createElement('div');
          column.className = 'column';
          column.innerHTML = `<h3>${sal}</h3>`;

          for (const item of list) {
            const p = document.createElement('p');
            p.innerHTML = `<strong>${item.time}</strong> ${item.title} <span class="teacher">${item.teacher}</span>`;
            column.appendChild(p);
          }

          wrapper.appendChild(column);
        }

        daySection.appendChild(wrapper);
        container.appendChild(daySection);
      }
    }

    function getWeekday(dateStr) {
      const days = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör'];
      const d = new Date(dateStr);
      return days[d.getDay()] || 'Okänd';
    }

    function daySort(a, b) {
      const order = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];
      return order.indexOf(a) - order.indexOf(b);
    }

    fetchData();
  </script>
</body>
</html>
