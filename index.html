
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema – Sollentuna Dans & Scenskola</title>
    <style>
        body {
            font-family: 'Agrandir', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 40px auto;
            max-width: 1000px;
        }
        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }
        th, td {
            padding: 14px 10px;
            text-align: left;
            border-bottom: 1px solid #dadada;
        }
        th {
            background-color: #CDDCD1;
            color: #000;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #e6f0ec;
        }
    </style>
</head>
<body>
    <h1>Veckoschema</h1>
    <table>
        <thead>
            <tr>
                <th>Dag</th>
                <th>Tid</th>
                <th>Kurs</th>
                <th>Lärare</th>
                <th>Plats</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
</body>
</html>
