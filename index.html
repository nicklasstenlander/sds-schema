<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Dansschema | Sollentuna Dans & Scenskola</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #a3c0b2;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }
        .column {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background-color: #f6f6f6;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #dadada;
        }
        .day {
            margin-bottom: 20px;
        }
        .day h3 {
            border-bottom: 1px solid #a3c0b2;
            padding-bottom: 5px;
        }
        .event {
            margin: 5px 0;
        }
        .event a {
            text-decoration: none;
            color: #000;
            background-color: #CDDCD1;
            padding: 6px 10px;
            border-radius: 5px;
            display: inline-block;
        }
        .event a:hover {
            background-color: #a3c0b2;
        }
    </style>
</head>
<body>
    <h1>Schema – Sollentuna Dans & Scenskola</h1>
    <div class="container">

    </div>
</body>
</html>
