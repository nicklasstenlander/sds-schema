<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Dagens schema | Sollentuna Dans & Scenskola</title>
<link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">
<meta http-equiv="refresh" content="600">
<style>
  body {
    font-family: 'Agrandir', sans-serif;
    background-color: #fff;
    color: #000;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    color: #000;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .card {
    background-color: #CDDCD1;
    border-radius: 20px;
    padding: 1.2rem 1.5rem;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  }
  .time {
    font-weight: bold;
    color: #000;
  }
  .name {
    font-size: 1.1rem;
    margin-top: 0.3rem;
  }
  .teacher, .place {
    color: #333;
    font-size: 0.95rem;
    margin-top: 0.2rem;
  }
</style>
</head>
<body>
<h1>Dagens schema – Tuesday 2025-11-04</h1>
<div class="grid">
<p>Inga lektioner idag.</p>
</div>
</body>
</html>
